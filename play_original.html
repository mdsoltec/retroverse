<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/rv-icon.png">
  <link rel="apple-touch-icon" href="assets/rv-icon.png">
  <title>RetroVerse - Jogando...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── EmulatorJS ocupa tela toda ── */
    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* ═══════════════════════════════════════════
       LOADING SCREEN
    ═══════════════════════════════════════════ */
    #rv-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #030604;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #rv-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .rv-bg {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(0,255,65,.13) 0%, transparent 65%), #030604;
    }
    .rv-bg::before {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,65,.03) 3px,rgba(0,255,65,.03) 4px);
      animation: scanPulse 4s linear infinite;
    }
    @keyframes scanPulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    .rv-logo {
      position: relative; z-index: 1;
      width: 90px; height: 90px;
      border: 2.5px solid #00ff41; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 2.2rem; font-weight: 900; color: #00ff41; letter-spacing: 2px;
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100%{ box-shadow: 0 0 20px rgba(0,255,65,.6),0 0 60px rgba(0,255,65,.2),inset 0 0 20px rgba(0,255,65,.08); }
      50%    { box-shadow: 0 0 35px rgba(0,255,65,.9),0 0 90px rgba(0,255,65,.35),inset 0 0 30px rgba(0,255,65,.15); }
    }
    .rv-name {
      position: relative; z-index: 1;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 2.2rem; font-weight: 900; letter-spacing: 8px; color: #fff;
      text-shadow: 0 0 20px rgba(0,255,65,.7), 0 0 40px rgba(0,255,65,.3);
    }
    .rv-slogan {
      position: relative; z-index: 1;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: .78rem; font-weight: 600; letter-spacing: 5px; color: #00ff41;
    }
    .rv-bar-wrap {
      position: relative; z-index: 1;
      width: 220px; height: 3px; background: rgba(0,255,65,.1);
      border-radius: 3px; overflow: hidden; margin-top: 10px;
    }
    .rv-bar {
      height: 100%; width: 40%; background: #00ff41; border-radius: 3px;
      box-shadow: 0 0 10px #00ff41;
      animation: barSweep 1.6s ease-in-out infinite;
    }
    @keyframes barSweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
    .rv-msg {
      position: relative; z-index: 1;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: .72rem; letter-spacing: 3px; color: rgba(0,255,65,.5);
      animation: blink 1.4s step-end infinite;
    }
    /* ═══════════════════════════════════════════
       BARRA DE PROGRESSO DO DOWNLOAD
    ═══════════════════════════════════════════ */
    #rv-download-progress {
      position: relative; z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 280px;
    }
    #rv-download-progress.visible { display: flex; }

    .rv-dl-title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: rgba(0,255,65,0.7);
      text-transform: uppercase;
    }

    .rv-dl-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(0,255,65,0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .rv-dl-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--green-neon, #00ff41);
      border-radius: 4px;
      box-shadow: 0 0 10px #00ff41;
      transition: width 0.3s ease;
    }

    .rv-dl-info {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
    }

    /* ═══════════════════════════════════════════
       BOTÃO FULLSCREEN (aparece após o jogo carregar)
       Toque do usuário → único jeito de fazer
       requestFullscreen funcionar no mobile
    ═══════════════════════════════════════════ */
    #rv-fs-btn {
      position: fixed;
      top: 10px; right: 10px;
      z-index: 8000;
      background: rgba(0,255,65,.12);
      border: 1px solid rgba(0,255,65,.4);
      border-radius: 8px;
      width: 38px; height: 38px;
      display: none;
      align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .2s;
    }
    #rv-fs-btn.visible { display: flex; }
    #rv-fs-btn:active  { background: rgba(0,255,65,.3); }
    #rv-fs-btn svg { width: 18px; height: 18px; fill: #00ff41; }

    /* ═══════════════════════════════════════════
       CONTROLES RETRO PREMIUM (overlay)
       Construídos inteiramente em HTML/CSS.
       Inputs enviados via EJS_emulator.gameManager.simulateInput()
    ═══════════════════════════════════════════ */
    #rv-pad {
      position: fixed;
      inset: 0;
      z-index: 5000;
      pointer-events: none; /* o próprio pad captura os toques */
      display: none; /* mostrado só em touch */
    }
    #rv-pad.active { display: block; }

    /* ── BASE DOS BOTÕES ── */
    .rv-btn {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 900;
      line-height: 1;
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease, opacity .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-btn.pressed {
      transform: scale(.82) !important;
      filter: brightness(1.5) !important;
    }

    /* ── SHOULDER PILLS ── */
    .rv-shoulder {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      border-radius: 14px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 900; font-size: .75rem;
      letter-spacing: 1px; text-transform: uppercase;
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-shoulder.pressed {
      transform: scale(.88) !important;
      filter: brightness(1.5) !important;
    }

    /* ── META (Select/Start) ── */
    .rv-meta {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      border-radius: 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 700; font-size: .55rem;
      letter-spacing: 1.5px; text-transform: uppercase;
      pointer-events: auto; cursor: pointer;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-meta.pressed { transform: scale(.88) !important; filter: brightness(1.4) !important; }

    /* ── DPAD ── */
    #rv-dpad {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
    }
    .rv-dpad-arm {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; /* tratado pelo dpad global */
    }
    .rv-dpad-arm svg { fill: currentColor; }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="rv-loading">
  <div class="rv-bg"></div>
  <div class="rv-logo">RV</div>
  <div class="rv-name">RETROVERSE</div>
  <div class="rv-slogan">ENTER THE CLASSICS</div>
  <div class="rv-bar-wrap"><div class="rv-bar"></div></div>
  <div class="rv-msg" id="rv-msg">Carregando emulador...</div>

  <!-- Barra de progresso do download (aparece para jogos grandes) -->
  <div id="rv-download-progress">
    <div class="rv-dl-title">⬇ BAIXANDO JOGO</div>
    <div class="rv-dl-bar-wrap">
      <div class="rv-dl-bar-fill" id="rv-dl-bar"></div>
    </div>
    <div class="rv-dl-info" id="rv-dl-info">0 MB / ? MB</div>
  </div>
</div>

<!-- BOTÃO FULLSCREEN (ativado por toque real) -->
<div id="rv-fs-btn" title="Tela cheia">

<!-- EMULADOR -->
<div id="game"></div>

<!-- OVERLAY DE CONTROLES RETRO -->

═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   URLs DAS ROMS
   Worker Cloudflare → Backblaze B2 (privado)
═══════════════════════════════════════════════════════════ */
const ROMS_BASE = 'https://retroverse-roms.mdsoltec.workers.dev/';

// Pré-baixa o jogo com barra de progresso antes de passar ao EmulatorJS
async function preloadGame(gamePath) {
  const url      = ROMS_BASE + gamePath;
  const msgEl    = document.getElementById('rv-msg');
  const dlWrap   = document.getElementById('rv-download-progress');
  const dlBar    = document.getElementById('rv-dl-bar');
  const dlInfo   = document.getElementById('rv-dl-info');

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Erro ao baixar');

    const total    = parseInt(response.headers.get('Content-Length') || '0');
    const reader   = response.body.getReader();
    const chunks   = [];
    let received   = 0;

    // Mostra barra de progresso apenas se souber o tamanho total
    if (total > 0) {
      msgEl.style.display   = 'none';
      dlWrap.classList.add('visible');
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;

      if (total > 0) {
        const pct     = Math.round((received / total) * 100);
        const recMB   = (received / 1024 / 1024).toFixed(1);
        const totMB   = (total    / 1024 / 1024).toFixed(1);
        dlBar.style.width = pct + '%';
        dlInfo.textContent = `${recMB} MB / ${totMB} MB  (${pct}%)`;
      }
    }

    // Esconde barra e restaura mensagem
    dlWrap.classList.remove('visible');
    msgEl.style.display = '';
    msgEl.textContent   = 'Iniciando emulador...';

    // Monta Blob com o tipo correto e retorna URL local
    const fileName = gamePath.split('/').pop(); // ex: kof98.zip
    const mimeType = fileName.endsWith('.zip') ? 'application/zip' : 'application/octet-stream';
    const blob = new Blob(chunks, { type: mimeType });
    const blobUrl = URL.createObjectURL(blob);

    // Para arcade (zip), o EmulatorJS precisa saber o nome do arquivo
    // Usamos o hack do File em vez de Blob puro
    if (fileName.endsWith('.zip')) {
      const file = new File(chunks, fileName, { type: mimeType });
      return URL.createObjectURL(file);
    }

    return blobUrl;

  } catch(e) {
    msgEl.textContent = 'Erro ao baixar o jogo. Tente novamente.';
    throw e;
  }
}

EJS_player             = '#game';

// BIOS do arcade é carregada dentro do preloadGame()

const isArcade = game.endsWith('.zip');

if (isArcade) {
  // Arcade: URL direta, sem preload (arquivos pequenos, FBNeo precisa do nome)
  EJS_gameUrl = ROMS_BASE + game;

  // BIOS também como URL direta
  EJS_biosUrl = ROMS_BASE + 'arcade/neogeo.zip';

  // Define callbacks e carrega o EmulatorJS
  EJS_onGameStart = function () {
    const loading = document.getElementById('rv-loading');
    if (loading) loading.classList.add('hidden');
    document.getElementById('rv-fs-btn').classList.add('visible');
    if (isTouch) {
      const skin = SKINS[core] || SKINS['snes'];
      buildPad(skin);
    }
  };

  setTimeout(() => {
    const loading = document.getElementById('rv-loading');
    if (loading) loading.classList.add('hidden');
    document.getElementById('rv-fs-btn').classList.add('visible');
    if (isTouch) {
      const skin = SKINS[core] || SKINS['snes'];
      buildPad(skin);
    }
  }, 14000);

  const script = document.createElement('script');
  script.src   = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  document.body.appendChild(script);

} else {
  // Outros consoles: preload com barra de progresso
  preloadGame(game).then(async blobUrl => {
    EJS_gameUrl = blobUrl;

    // Define callbacks e carrega o EmulatorJS
    EJS_onGameStart = function () {
      const loading = document.getElementById('rv-loading');
      if (loading) loading.classList.add('hidden');
      document.getElementById('rv-fs-btn').classList.add('visible');
      if (isTouch) {
        const skin = SKINS[core] || SKINS['snes'];
        buildPad(skin);
      }
    };

    setTimeout(() => {
      const loading = document.getElementById('rv-loading');
      if (loading) loading.classList.add('hidden');
      document.getElementById('rv-fs-btn').classList.add('visible');
      if (isTouch) {
        const skin = SKINS[core] || SKINS['snes'];
        buildPad(skin);
      }
    }, 14000);

    const script = document.createElement('script');
    script.src   = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(script);

  }).catch(err => {
    console.error('Falha ao carregar o jogo:', err);
    const msgEl = document.getElementById('rv-msg');
    if (msgEl) msgEl.textContent = 'Erro ao carregar. Tente novamente.';
  });

/* ═══════════════════════════════════════════════════════════
   ESCONDE O GAMEPAD NATIVO DO EMULATORJS IMEDIATAMENTE
   Usamos MutationObserver para capturar e ocultar assim
   que o EmulatorJS cria os elementos no DOM.
   A injeção de CSS com !important garante mesmo se o
   EmulatorJS tentar recriar os elementos depois.
═══════════════════════════════════════════════════════════ */
(function hideNativeGamepad() {
  // CSS injetado imediatamente — bloqueia qualquer gamepad nativo
  const style = document.createElement('style');
  style.id = 'rv-hide-native-pad';
  style.textContent = `
    .ejs_virtualGamepad,
    .ejs-virtualGamepad,
    [class*="virtualGamepad"],
    [class*="virtual_gamepad"],
    [class*="gamepad_container"],
    [class*="touch_controls"],
    [class*="ejs_gamepad"],
    [class*="ejs-gamepad"],
    [id*="virtualGamepad"],
    [id*="gamepad"],
    .ejs_gamepad_button,
    .ejs_gamepad_dpad,
    .ejs_gamepad_select,
    .ejs_gamepad_start,
    [class*="b_left"], [class*="b_right"],
    [class*="b_fast"], [class*="b_slow"],
    [class*="b_menu"],
    [class*="nipple"], [class*="zone"],
    [class*="joystick"], [class*="stick"],
    .back, .front {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
  `;
  document.head.appendChild(style);

  // MutationObserver como segunda camada de proteção
  if (isTouch) {
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        m.addedNodes.forEach(node => {
          if (!(node instanceof HTMLElement)) return;
          const cls = (node.className || '') + (node.id || '');
          // Detecta elementos do gamepad nativo e oculta
          if (/gamepad|virtualGamepad|nipple|joystick|b_left|b_right|b_fast|b_slow|b_menu|touch_control/i.test(cls)) {
            node.style.cssText = 'display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;';
          }
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
}());

/* ═══════════════════════════════════════════════════════════
   ENVIO DE INPUT
═══════════════════════════════════════════════════════════ */
function sendInput(inputId, value) {
  try {
    if (window.EJS_emulator && EJS_emulator.gameManager) {
      EJS_emulator.gameManager.simulateInput(0, inputId, value);
    }
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════
   CONSTRUÇÃO DO CONTROLE RETRO
   Referência visual: Super Retro 16
   ─ Barra de controles sólida na base da tela
   ─ D-Pad/Analógico à esquerda num disco
   ─ Losango de botões à direita
   ─ L / R como abas no topo
   ─ SELECT / START / MENU centralizados
═══════════════════════════════════════════════════════════ */
function buildPad(skin) {
  const pad = document.getElementById('rv-pad');
  pad.innerHTML = '';

  const W  = window.innerWidth;
  const H  = window.innerHeight;
  const LS = W > H;

  /* ─────────────────────────────────────────────
     BARRA DE CONTROLES
     Portrait  : faixa fixa na base (~42% da altura, máx 260px)
     Landscape : colunas laterais fixas (~24% da largura, máx 180px)
  ───────────────────────────────────────────── */
  const BAR_H = LS ? H : Math.round(Math.min(H * 0.42, 260));
  const BAR_Y = H - BAR_H;
  const COL_W = LS ? Math.round(Math.min(W * 0.24, 180)) : Math.round(W * 0.50);

  /* ── Tamanhos — todas as const primeiro, sem dependência de ordem ── */
  const MAR  = 8;
  const REF  = LS ? COL_W : BAR_H;
  const DS   = Math.round(Math.min(REF * 0.72, LS ? COL_W - 16 : 160));
  const BS   = Math.round(Math.min(REF * 0.28, LS ? (COL_W - DS) * 0.9 : 62));
  const GAP  = Math.round(BS * 0.10);
  const SW   = Math.round(Math.min(COL_W * 0.90, LS ? COL_W - 2*MAR : 88));
  const SH   = Math.round(Math.min(REF * 0.14, 34));
  const MW   = Math.round(Math.min(LS ? COL_W - 2*MAR : W * 0.14, 72));
  const MH   = Math.round(Math.min(REF * 0.12, 28));

  /* Fundo da barra / colunas — depois das const para ter MAR disponível */
  if (LS) {
    [0, W - COL_W].forEach(x => {
      const d = document.createElement('div');
      Object.assign(d.style, {
        position:'absolute', left:x+'px', top:'0',
        width:COL_W+'px', height:H+'px',
        background: skin.barBg || 'rgba(0,0,0,0.55)',
        zIndex:'1', pointerEvents:'none',
      });
      pad.appendChild(d);
    });
  } else {
    const d = document.createElement('div');
    Object.assign(d.style, {
      position:'absolute', left:'0', top:BAR_Y+'px',
      width:W+'px', height:BAR_H+'px',
      background: skin.barBg || 'rgba(0,0,0,0.55)',
      zIndex:'1', pointerEvents:'none',
    });
    pad.appendChild(d);
  }

  /* ── Centro do disco esquerdo ── */
  const diskCX = LS ? Math.round(COL_W / 2)       : Math.round(W * 0.25);
  const diskCY = LS
    ? Math.round(H * 0.58)   // landscape: levemente abaixo do centro
    : Math.round(BAR_Y + BAR_H * 0.52);

  /* ── Centro do losango direito ── */
  const faceCX = LS ? Math.round(W - COL_W / 2)   : Math.round(W * 0.75);
  const faceCY = diskCY;

  /* ── Shoulders ── */
  const shY = LS ? MAR : BAR_Y + MAR;

  /* ── Meta: entre o disco e o losango ── */
  const metaCY = LS
    ? Math.round(H / 2 - MH / 2)
    : Math.round(BAR_Y + BAR_H * 0.12);

  /* ── Losango offsets ── */
  const OFF  = BS + GAP;
  const FPOS = [
    { dx: -OFF, dy:    0 }, // esq
    { dx:    0, dy: -OFF }, // cima
    { dx:  OFF, dy:    0 }, // dir
    { dx:    0, dy:  OFF }, // baixo
  ];

  /* ─────────────────────────────────────────────
     FÁBRICA
  ───────────────────────────────────────────── */
  function mkEl(cls, styles) {
    const e = document.createElement('div');
    e.className = cls;
    Object.assign(e.style, { position:'absolute', zIndex:'5' }, styles);
    return e;
  }

  /* Botão de face — círculo com glow */
  function makeBtn(f, cx, cy, size) {
    const sz  = Math.max(size, 34);
    const fsz = f.fontSize || Math.round(sz * 0.42);
    const e   = mkEl('rv-btn', {
      width: sz+'px', height: sz+'px',
      left:  (cx - sz/2)+'px', top: (cy - sz/2)+'px',
      fontSize: fsz+'px',
      color: '#fff',
      background: f.color,
      border: `2.5px solid ${f.border}`,
      boxShadow: `0 0 18px ${f.glow||f.border+'99'}, 0 4px 14px rgba(0,0,0,.75), inset 0 1px 4px rgba(255,255,255,.15)`,
      opacity: '.97',
    });
    e.textContent = f.label;
    bindBtn(e, f.input);
    return e;
  }

  /* Shoulder — aba com cantos arredondados num lado */
  function makeShoulder(sh, x, y) {
    // Em landscape: shoulder ocupa a largura total da coluna (encostado na borda)
    const w = LS ? SW : SW;
    const lx = LS && sh.side === 'right' ? W - MAR - w : (LS ? MAR : x);
    const e = mkEl('rv-shoulder', {
      width:  w+'px', height: SH+'px',
      left: (LS ? lx : x)+'px', top: y+'px',
      fontSize: Math.round(SH * 0.52)+'px',
      color: '#fff',
      background: sh.color,
      border: `1.5px solid ${sh.border}`,
      boxShadow: `0 0 12px ${sh.glow}, 0 3px 8px rgba(0,0,0,.7)`,
      opacity: '.95',
      borderRadius: sh.side === 'right' ? '10px 4px 4px 10px' : '4px 10px 10px 4px',
    });
    e.textContent = sh.label;
    bindBtn(e, sh.input);
    return e;
  }

  /* Meta (Select/Start/Menu) — pílula */
  function makeMeta(m, cx, cy, w, h) {
    const e = mkEl('rv-meta', {
      width: w+'px', height: h+'px',
      left: (cx - w/2)+'px', top: (cy - h/2)+'px',
      fontSize: Math.round(h * 0.50)+'px',
      color: m.textColor || 'rgba(255,255,255,0.7)',
      background: m.color,
      border: `1px solid ${m.border}`,
      borderRadius: '20px',
      opacity: '.92',
    });
    e.textContent = m.label;
    bindBtn(e, m.input);
    return e;
  }

  /* ─────────────────────────────────────────────
     BIND TOQUE
  ───────────────────────────────────────────── */
  function bindBtn(e, id) {
    e.addEventListener('touchstart',  ev=>{ev.preventDefault();e.classList.add('pressed');   sendInput(id,1);},{passive:false});
    e.addEventListener('touchend',    ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});
    e.addEventListener('touchcancel', ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});
    e.addEventListener('mousedown', ()=>{e.classList.add('pressed');   sendInput(id,1);});
    e.addEventListener('mouseup',   ()=>{e.classList.remove('pressed');sendInput(id,0);});
  }

  /* ─────────────────────────────────────────────
     D-PAD DIGITAL
     Disco branco ao redor, cruz no centro
  ───────────────────────────────────────────── */
  function makeDpad(color, border, cx, cy, size) {
    const wrap = mkEl('', {
      width: size+'px', height: size+'px',
      left: (cx - size/2)+'px', top: (cy - size/2)+'px',
      touchAction:'none', pointerEvents:'auto', zIndex:'6',
      borderRadius: '50%',
      background: skin.diskBg || 'rgba(255,255,255,0.07)',
      border: `2px solid ${skin.diskBorder || border+'44'}`,
      boxShadow: `0 4px 20px rgba(0,0,0,.5)`,
    });
    wrap.id = 'rv-dpad';

    const inner = Math.round(size * 0.75);
    const offset = Math.round((size - inner) / 2);

    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 90 90');
    svg.setAttribute('width', inner);
    svg.setAttribute('height', inner);
    svg.style.cssText = `position:absolute;top:${offset}px;left:${offset}px;pointer-events:none;`;
    svg.innerHTML = `<g filter="drop-shadow(0 2px 8px rgba(0,0,0,.9))">
      <rect x="27" y="5"  width="36" height="80" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/>
      <rect x="5"  y="27" width="80" height="36" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/>
      <rect x="27" y="27" width="36" height="36" rx="5"  fill="${color}"/>
      <polygon points="45,11 54,26 36,26" fill="${border}" opacity=".95"/>
      <polygon points="45,79 54,64 36,64" fill="${border}" opacity=".95"/>
      <polygon points="11,45 26,54 26,36" fill="${border}" opacity=".95"/>
      <polygon points="79,45 64,54 64,36" fill="${border}" opacity=".95"/>
    </g>`;
    wrap.appendChild(svg);

    const DIRS=[
      {up:1,left:1},{up:1},{up:1,right:1},
      {left:1},     {},    {right:1},
      {down:1,left:1},{down:1},{down:1,right:1}
    ];
    DIRS.forEach((d,i)=>{
      const z=document.createElement('div');
      z.style.cssText=`position:absolute;left:${(i%3)*33.34}%;top:${Math.floor(i/3)*33.34}%;width:33.34%;height:33.34%;pointer-events:none;`;
      Object.assign(z.dataset,{up:d.up?'1':'0',down:d.down?'1':'0',left:d.left?'1':'0',right:d.right?'1':'0'});
      wrap.appendChild(z);
    });

    const st={up:0,down:0,left:0,right:0};
    const ID={up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
    function upd(ns){for(const d in st)if(ns[d]!==st[d]){sendInput(ID[d],ns[d]);st[d]=ns[d];}}
    function fp(px,py){
      const r=wrap.getBoundingClientRect(),s3=r.width/3;
      const i=Math.max(0,Math.min(8,Math.floor((py-r.top)/s3)*3+Math.floor((px-r.left)/s3)));
      const d=DIRS[i];return{up:d.up?1:0,down:d.down?1:0,left:d.left?1:0,right:d.right?1:0};
    }
    const clr=()=>upd({up:0,down:0,left:0,right:0});
    wrap.addEventListener('touchstart', e=>{e.preventDefault();upd(fp(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
    wrap.addEventListener('touchmove',  e=>{e.preventDefault();upd(fp(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
    wrap.addEventListener('touchend',   e=>{e.preventDefault();clr();},{passive:false});
    wrap.addEventListener('touchcancel',e=>{e.preventDefault();clr();},{passive:false});
    return wrap;
  }

  /* ─────────────────────────────────────────────
     JOYSTICK ANALÓGICO
     Mesmo disco mas com knob móvel
  ───────────────────────────────────────────── */
  function makeAnalog(color, border, cx, cy, size) {
    const wrap = mkEl('', {
      width: size+'px', height: size+'px',
      left: (cx - size/2)+'px', top: (cy - size/2)+'px',
      touchAction:'none', pointerEvents:'auto', zIndex:'6',
      borderRadius:'50%',
      background: skin.diskBg || 'rgba(255,255,255,0.07)',
      border: `2px solid ${skin.diskBorder || border+'44'}`,
      boxShadow: '0 4px 20px rgba(0,0,0,.5)',
    });

    const R   = size / 2;
    const KR  = Math.round(R * 0.42);
    const MAX = R - KR - 6;

    // Anel interno
    const inner = mkEl('', {
      position:'absolute',
      width: Math.round(size*0.75)+'px', height: Math.round(size*0.75)+'px',
      left: Math.round(size*0.125)+'px', top: Math.round(size*0.125)+'px',
      borderRadius:'50%',
      background:`radial-gradient(circle at 38% 35%, ${color}cc, ${color}77)`,
      border:`2px solid ${border}55`,
      pointerEvents:'none',
    });

    // Marcadores de direção
    const mk=document.createElementNS('http://www.w3.org/2000/svg','svg');
    mk.setAttribute('viewBox','0 0 100 100');
    Object.assign(mk.style,{position:'absolute',inset:'0',width:'100%',height:'100%',pointerEvents:'none',opacity:'.6'});
    mk.innerHTML=`
      <polygon points="50,6 58,20 42,20"  fill="${border}"/>
      <polygon points="50,94 58,80 42,80" fill="${border}"/>
      <polygon points="6,50 20,58 20,42"  fill="${border}"/>
      <polygon points="94,50 80,58 80,42" fill="${border}"/>`;
    inner.appendChild(mk);
    wrap.appendChild(inner);

    // Knob
    const knob = mkEl('', {
      position:'absolute',
      width: KR*2+'px', height: KR*2+'px',
      borderRadius:'50%',
      left:(R-KR)+'px', top:(R-KR)+'px',
      background:`radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), ${border}cc)`,
      border:`2.5px solid ${border}`,
      boxShadow:`0 0 18px ${border}bb, 0 4px 16px rgba(0,0,0,.8), inset 0 1px 6px rgba(255,255,255,.22)`,
      transition:'none', pointerEvents:'none',
    });
    wrap.appendChild(knob);

    let active=false, ox=0, oy=0;
    const THRESH=0.40, AV=0x7fff;
    const sent={up:0,down:0,left:0,right:0};
    const DM={up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
    function sDir(d,v){if(sent[d]===v)return;sent[d]=v;sendInput(DM[d],v);}
    function sAn(nx,ny){
      sendInput(EJS_INPUT.LSTICK_RIGHT,nx>0?Math.round(nx*AV):0);
      sendInput(EJS_INPUT.LSTICK_LEFT, nx<0?Math.round(-nx*AV):0);
      sendInput(EJS_INPUT.LSTICK_DOWN, ny>0?Math.round(ny*AV):0);
      sendInput(EJS_INPUT.LSTICK_UP,   ny<0?Math.round(-ny*AV):0);
    }
    function relAll(){sDir('up',0);sDir('down',0);sDir('left',0);sDir('right',0);sAn(0,0);}
    function mv(dx,dy){
      const dist=Math.sqrt(dx*dx+dy*dy),cl=Math.min(dist,MAX),ang=Math.atan2(dy,dx);
      const cx2=Math.cos(ang)*cl,cy2=Math.sin(ang)*cl;
      knob.style.transform=`translate(${cx2}px,${cy2}px)`;
      const nx=cx2/MAX,ny=cy2/MAX;
      sAn(nx,ny);
      sDir('right',nx>THRESH?1:0);sDir('left',nx<-THRESH?1:0);
      sDir('down',ny>THRESH?1:0);sDir('up',ny<-THRESH?1:0);
    }
    function onS(e){e.preventDefault();const t=e.touches?e.touches[0]:e;const r=wrap.getBoundingClientRect();active=true;ox=r.left+R;oy=r.top+R;mv(t.clientX-ox,t.clientY-oy);}
    function onM(e){if(!active)return;e.preventDefault();const t=e.touches?e.touches[0]:e;mv(t.clientX-ox,t.clientY-oy);}
    function onE(e){e.preventDefault();active=false;knob.style.transition='transform .13s cubic-bezier(.25,.8,.25,1)';knob.style.transform='translate(0,0)';setTimeout(()=>{knob.style.transition='none';},140);relAll();}
    wrap.addEventListener('touchstart', onS,{passive:false});
    wrap.addEventListener('touchmove',  onM,{passive:false});
    wrap.addEventListener('touchend',   onE,{passive:false});
    wrap.addEventListener('touchcancel',onE,{passive:false});
    wrap.addEventListener('mousedown',  onS);
    window.addEventListener('mousemove',e=>{if(active)onM(e);});
    window.addEventListener('mouseup',  e=>{if(active)onE(e);});
    return wrap;
  }

  /* ─────────────────────────────────────────────
     MONTA O PAD
  ───────────────────────────────────────────── */
  const s = skin;

  // 1. D-Pad ou Analógico — disco esquerdo
  if (s.analog) {
    pad.appendChild(makeAnalog(s.dpad.color, s.dpad.border, diskCX, diskCY, DS));
  } else {
    pad.appendChild(makeDpad(s.dpad.color, s.dpad.border, diskCX, diskCY, DS));
  }

  // 2. Botões de face — losango direito
  s.face.forEach((f, i) => {
    const pos = FPOS[i % 4];
    pad.appendChild(makeBtn(f,
      Math.round(faceCX + pos.dx),
      Math.round(faceCY + pos.dy),
      BS
    ));
  });

  // 3. Shoulders — abas no topo
  s.shoulders.forEach(sh => {
    const isR = sh.side === 'right';
    const row = sh.row || 0;
    const x   = isR ? W - MAR - SW : MAR;
    const y   = shY + row * (SH + 4);
    pad.appendChild(makeShoulder(sh, x, y));
  });

  // 4. Meta (Select / Start)
  // PORTRAIT  → centro horizontal na barra, lado a lado
  // LANDSCAPE → SELECT embaixo do L (esquerda) | START embaixo do R (direita)
  //             Centro da tela LIVRE para o jogo
  if (LS) {
    // Calcula Y: abaixo do último shoulder da coluna
    const lastShRow = Math.max(0, ...s.shoulders.map(sh => sh.row || 0));
    const metaShY   = shY + (lastShRow + 1) * (SH + 4) + 4;

    s.meta.forEach((m, i) => {
      const isRight = i === s.meta.length - 1; // último = START → direita
      const x = isRight ? W - MAR - MW : MAR;
      pad.appendChild(makeMeta(m, x + MW/2, metaShY + MH/2, MW, MH));
    });
  } else {
    // Portrait: centro horizontal, topo da barra
    const metaGap    = Math.round(MW * 0.15);
    const metaTotalW = s.meta.length * MW + (s.meta.length - 1) * metaGap;
    const metaStartX = Math.round(W / 2 - metaTotalW / 2);
    s.meta.forEach((m, i) => {
      const cx2 = metaStartX + i * (MW + metaGap) + MW / 2;
      pad.appendChild(makeMeta(m, cx2, metaCY + MH / 2, MW, MH));
    });
  }

  pad.classList.add('active');
}

/* ═══════════════════════════════════════════════════════════
   FULLSCREEN  — apenas via gesto do usuário
═══════════════════════════════════════════════════════════ */
function requestFS() {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen)?.call(el);
  /* iOS Safari: não suporta fullscreen API — usamos meta viewport trick */
  document.querySelector('meta[name=viewport]').content =
    'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
  document.getElementById('rv-fs-btn').style.display = 'none';
}

document.getElementById('rv-fs-btn').addEventListener('click', requestFS);
document.getElementById('rv-fs-btn').addEventListener('touchend', e => { e.preventDefault(); requestFS(); }, {passive:false});

/* Reconstrói pad na mudança de orientação */
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    const skin = SKINS[core] || SKINS['snes'];
    if (isTouch && document.getElementById('rv-pad').classList.contains('active')) {
      buildPad(skin);
    }
  }, 350);
});
window.addEventListener('resize', () => {
  const skin = SKINS[core] || SKINS['snes'];
  if (isTouch && document.getElementById('rv-pad').classList.contains('active')) {
    buildPad(skin);
  }
});

// EJS_onGameStart e fallback são definidos dentro do preloadGame().then()
</script>

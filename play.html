<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/rv-icon.png">
  <link rel="apple-touch-icon" href="assets/rv-icon.png">
  <title>RetroVerse - Jogando...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* LOADING */
    #rv-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #030604;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #rv-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .rv-bg {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(0,255,65,.13) 0%, transparent 65%), #030604;
    }
    .rv-bg::before {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,65,.03) 3px,rgba(0,255,65,.03) 4px);
      animation: scanPulse 4s linear infinite;
    }
    @keyframes scanPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    .rv-logo {
      position: relative; z-index: 1;
      width: 90px; height: 90px;
      border: 2.5px solid #00ff41; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 2.2rem; font-weight: 900; color: #00ff41; letter-spacing: 2px;
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100%{ box-shadow: 0 0 20px rgba(0,255,65,.6),0 0 60px rgba(0,255,65,.2),inset 0 0 20px rgba(0,255,65,.08); }
      50%    { box-shadow: 0 0 35px rgba(0,255,65,.9),0 0 90px rgba(0,255,65,.35),inset 0 0 30px rgba(0,255,65,.15); }
    }
    .rv-name { position: relative; z-index: 1; font-size: 2.2rem; font-weight: 900; letter-spacing: 8px; color: #fff; text-shadow: 0 0 20px rgba(0,255,65,.7); }
    .rv-slogan { position: relative; z-index: 1; font-size: .78rem; font-weight: 600; letter-spacing: 5px; color: #00ff41; }
    .rv-bar-wrap { position: relative; z-index: 1; width: 220px; height: 3px; background: rgba(0,255,65,.1); border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .rv-bar { height: 100%; width: 40%; background: #00ff41; border-radius: 3px; box-shadow: 0 0 10px #00ff41; animation: barSweep 1.6s ease-in-out infinite; }
    @keyframes barSweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
    .rv-msg { position: relative; z-index: 1; font-size: .72rem; letter-spacing: 3px; color: rgba(0,255,65,.5); }

    #rv-download-progress { position: relative; z-index: 2; display: none; flex-direction: column; align-items: center; gap: 10px; width: 280px; }
    #rv-download-progress.visible { display: flex; }
    .rv-dl-title { font-size: 0.7rem; letter-spacing: 3px; color: rgba(0,255,65,0.7); text-transform: uppercase; }
    .rv-dl-bar-wrap { width: 100%; height: 4px; background: rgba(0,255,65,0.1); border-radius: 4px; overflow: hidden; }
    .rv-dl-bar-fill { height: 100%; width: 0%; background: #00ff41; border-radius: 4px; box-shadow: 0 0 10px #00ff41; transition: width 0.3s ease; }
    .rv-dl-info { font-size: 0.72rem; letter-spacing: 2px; color: rgba(255,255,255,0.5); }

    #rv-fs-btn {
      position: fixed; top: 10px; right: 10px; z-index: 8000;
      background: rgba(0,255,65,.12); border: 1px solid rgba(0,255,65,.4);
      border-radius: 8px; width: 38px; height: 38px;
      display: none; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #rv-fs-btn.visible { display: flex; }
    #rv-fs-btn svg { width: 18px; height: 18px; fill: #00ff41; }

    /* ═══════════════════════════════════════════
       OVERLAY SYSTEM
       Container posicionado no bottom com a imagem
       e zonas de toque transparentes por cima
    ═══════════════════════════════════════════ */
    #rv-overlay {
      position: fixed;
      bottom: 0; left: 0;
      z-index: 5000;
      pointer-events: none;
      display: none;
      overflow: visible;
      max-height: 100vh;
    }
    #rv-overlay.active { display: block; }

    #rv-overlay img.rv-skin-img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    /* Imagem animated (feedback de pressionar) */
    #rv-overlay img.rv-anim-img {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: auto;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.06s ease;
    }
    #rv-overlay img.rv-anim-img.show { opacity: 1; }

    /* Zonas de toque */
    .rv-zone {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
      cursor: pointer;
    }
    .rv-zone.pressed { opacity: 0.7; }

    .rv-zone-dpad {
      border-radius: 50%;
    }

    /* ═══════════════════════════════════════════
       CONTROLES CSS FALLBACK (landscape/arcade)
    ═══════════════════════════════════════════ */
    #rv-pad { position: fixed; inset: 0; z-index: 5000; pointer-events: none; display: none; }
    #rv-pad.active { display: block; }
    .rv-btn {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 900; line-height: 1;
      pointer-events: auto; cursor: pointer; touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-btn.pressed { transform: scale(.82) !important; filter: brightness(1.5) !important; }
    .rv-shoulder {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 14px; font-weight: 900; font-size: .75rem;
      letter-spacing: 1px; text-transform: uppercase;
      pointer-events: auto; cursor: pointer; touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-shoulder.pressed { transform: scale(.88) !important; filter: brightness(1.5) !important; }
    .rv-meta {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 20px; font-weight: 700; font-size: .55rem;
      letter-spacing: 1.5px; text-transform: uppercase;
      pointer-events: auto; cursor: pointer; touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-meta.pressed { transform: scale(.88) !important; filter: brightness(1.4) !important; }
    #rv-dpad { position: absolute; pointer-events: auto; touch-action: none; }
  </style>
</head>

const ROMS_BASE = 'https://retroverse-roms.mdsoltec.workers.dev/';

async function preloadGame(gamePath) {
  // Codifica cada segmento do path para lidar com apóstrofos e caracteres especiais
  const encodedPath = gamePath.split('/').map(seg => 
    encodeURIComponent(seg).replace(/'/g, '%27')
  ).join('/');
  const url = ROMS_BASE + encodedPath;
  const msgEl = document.getElementById('rv-msg');
  const dlWrap = document.getElementById('rv-download-progress');
  const dlBar = document.getElementById('rv-dl-bar');
  const dlInfo = document.getElementById('rv-dl-info');
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Erro');
    const total = parseInt(response.headers.get('Content-Length') || '0');
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    if (total > 0) { msgEl.style.display = 'none'; dlWrap.classList.add('visible'); }
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length;
      if (total > 0) {
        dlBar.style.width = Math.round((received/total)*100) + '%';
        dlInfo.textContent = `${(received/1048576).toFixed(1)} MB / ${(total/1048576).toFixed(1)} MB`;
      }
    }
    dlWrap.classList.remove('visible'); msgEl.style.display = ''; msgEl.textContent = 'Iniciando emulador...';
    const fn = gamePath.split('/').pop();
    const mt = fn.endsWith('.zip') ? 'application/zip' : 'application/octet-stream';
    if (fn.endsWith('.zip')) return URL.createObjectURL(new File(chunks, fn, {type:mt}));
    return URL.createObjectURL(new Blob(chunks, {type:mt}));
  } catch(e) { msgEl.textContent = 'Erro ao baixar.'; throw e; }
}

EJS_player = '#game'; EJS_core = core;
EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
EJS_startOnLoaded = true; EJS_fullscreenOnLoaded = false;

const isArcade = game.endsWith('.zip');

function onGameReady() {
  const ld = document.getElementById('rv-loading');
  if (ld) ld.classList.add('hidden');
  document.getElementById('rv-fs-btn').classList.add('visible');
  if (isTouch) initControls();
}

if (isArcade) {
  EJS_gameUrl = ROMS_BASE + game; EJS_biosUrl = ROMS_BASE + 'arcade/neogeo.zip';
  EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
  const s = document.createElement('script'); s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js'; document.body.appendChild(s);
} else {
  preloadGame(game).then(blobUrl => {
    EJS_gameUrl = blobUrl; EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
    const s = document.createElement('script'); s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js'; document.body.appendChild(s);
  }).catch(() => { document.getElementById('rv-msg').textContent = 'Erro ao carregar.'; });
}

(function(){
  const st = document.createElement('style');
  st.textContent = `.ejs_virtualGamepad,.ejs-virtualGamepad,[class*="virtualGamepad"],[class*="gamepad_container"],[class*="touch_controls"],[class*="ejs_gamepad"],[class*="ejs-gamepad"],[id*="virtualGamepad"],.ejs_gamepad_button,.ejs_gamepad_dpad,[class*="b_left"],[class*="b_right"],[class*="b_fast"],[class*="b_slow"],[class*="b_menu"],[class*="nipple"],[class*="joystick"],[class*="stick"],.back,.front{display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;}`;
  document.head.appendChild(st);
  if (isTouch) {
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
      if (!(n instanceof HTMLElement)) return;
      if (/gamepad|virtualGamepad|nipple|joystick|b_left|b_right|b_fast|b_slow|b_menu|touch_control/i.test((n.className||'')+(n.id||''))
          && !n.classList.contains('rv-zone') && !n.classList.contains('rv-zone-dpad'))
        n.style.cssText='display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;';
    }))).observe(document.body, {childList:true, subtree:true});
  }
}());

function sendInput(id, val) {
  try { if (window.EJS_emulator?.gameManager) EJS_emulator.gameManager.simulateInput(0, id, val); } catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   INIT CONTROLS
   Portrait + overlay disponível → sistema de imagem calibrado
   Landscape ou sem overlay → controles CSS
═══════════════════════════════════════════════════════════ */
function initControls() {
  const W = window.innerWidth, H = window.innerHeight;
  const isPortrait = H > W;
  const overlay = OVERLAYS[core];

  document.getElementById('rv-overlay').classList.remove('active');
  document.getElementById('rv-overlay').innerHTML = '';
  document.getElementById('rv-pad').classList.remove('active');
  document.getElementById('rv-pad').innerHTML = '';

  if (isPortrait && overlay && overlay.base) {
    buildOverlay(overlay);
  } else {
    buildPad(SKINS[core] || SKINS['snes']);
  }
}

/* ═══════════════════════════════════════════════════════════
   BUILD OVERLAY (sistema calibrado com zonas de toque)
═══════════════════════════════════════════════════════════ */
function buildOverlay(cfg) {
  const wrap = document.getElementById('rv-overlay');
  wrap.innerHTML = '';

  const W = window.innerWidth;
  const H = window.innerHeight;
  const containerH = Math.round(W * cfg.aspect);
  
  // Modo debug: adiciona ?debug=1 na URL para ver as zonas
  const DEBUG = new URLSearchParams(window.location.search).has('debug');

  // Seta o tamanho do container (limita à altura da tela)
  const actualH = Math.min(containerH, H);
  Object.assign(wrap.style, {
    width: W + 'px',
    height: actualH + 'px',
  });

  // Imagem base
  const baseImg = document.createElement('img');
  baseImg.className = 'rv-skin-img';
  baseImg.src = cfg.base;
  baseImg.draggable = false;
  Object.assign(baseImg.style, {
    width: W + 'px',
    height: containerH + 'px',
    position: 'absolute',
    bottom: '0',
    left: '0',
  });
  wrap.appendChild(baseImg);

  // Imagem animada
  let animImg = null;
  if (cfg.animated) {
    animImg = document.createElement('img');
    animImg.className = 'rv-anim-img';
    animImg.src = cfg.animated;
    animImg.draggable = false;
    Object.assign(animImg.style, {
      width: W + 'px',
      height: containerH + 'px',
      position: 'absolute',
      bottom: '0',
      left: '0',
    });
    wrap.appendChild(animImg);
  }

  // Pré-carrega animações de botões
  if (cfg.animButtons) {
    for (const src of Object.values(cfg.animButtons)) { const i = new Image(); i.src = src; }
  }

  function showAnim(src) {
    if (!animImg) return;
    if (src) { animImg.src = src; animImg.classList.add('show'); }
    else { animImg.classList.remove('show'); }
  }

  // Helper: calcula posição em px a partir de % da imagem
  // As coordenadas são % da imagem inteira (que pode ser maior que o container visível)
  // Precisamos converter para posição dentro do container
  const offsetY = containerH - actualH; // Quanto da imagem está cortada no topo
  const px = (pct, dim) => {
    if (dim === 'x') return (pct / 100) * W;
    // Para Y: converte % da imagem para px dentro do container
    return (pct / 100) * containerH - offsetY;
  };

  if (DEBUG) {
    console.log('Overlay debug:', { W, H, containerH, actualH, offsetY });
  }

  // Cria zonas de toque
  for (const [name, zone] of Object.entries(cfg.zones)) {
    if (zone.type === 'dpad') {
      const el = document.createElement('div');
      el.className = 'rv-zone rv-zone-dpad';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
      });
      
      if (DEBUG) {
        el.style.border = '2px solid lime';
        el.style.background = 'rgba(0,255,0,0.2)';
        el.textContent = 'DPAD';
        el.style.color = 'lime';
        el.style.fontSize = '10px';
        el.style.fontWeight = 'bold';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
      }

      const st = {up:0,down:0,left:0,right:0};
      const ID = {up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
      function upd(ns) { for (const d in st) if (ns[d]!==st[d]) { sendInput(ID[d],ns[d]); st[d]=ns[d]; }
        if (cfg.animButtons) { let s=null; if(ns.up)s=cfg.animButtons.UP; else if(ns.down)s=cfg.animButtons.DOWN; else if(ns.left)s=cfg.animButtons.LEFT; else if(ns.right)s=cfg.animButtons.RIGHT; showAnim(s); }
      }
      function getDir(px2,py2) {
        const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
        const dx=px2-cx, dy=py2-cy, a=Math.atan2(dy,dx), d=Math.sqrt(dx*dx+dy*dy);

      wrap.appendChild(el);

    } else if (zone.type === 'analog') {

      const el = document.createElement('div');

      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');

      wrap.appendChild(el);

    } else if (zone.type === 'btn') {
      const el = document.createElement('div');
      el.className = 'rv-zone';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
        borderRadius: '30%',
      });

      if (DEBUG) {
        el.style.border = '2px solid red';
        el.style.background = 'rgba(255,0,0,0.2)';
        el.textContent = name;
        el.style.color = 'red';
        el.style.fontSize = '9px';
        el.style.fontWeight = 'bold';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
      }

      const inputId = zone.input;
      const btnName = name;

      function press() {
        el.classList.add('pressed');
        sendInput(inputId, 1);
        if (cfg.animButtons?.[btnName]) showAnim(cfg.animButtons[btnName]);

      el.addEventListener('touchcancel', e=>{e.preventDefault();e.stopPropagation();release();},{passive:false});
      el.addEventListener('mousedown', e=>{e.preventDefault();e.stopPropagation();press();});
      el.addEventListener('mouseup', e=>{e.preventDefault();e.stopPropagation();release();});
      wrap.appendChild(el);

  }

  wrap.classList.add('active');
}

/* ═══════════════════════════════════════════════════════════
   BUILD PAD (CSS fallback para landscape)
═══════════════════════════════════════════════════════════ */
function buildPad(skin) {
  const pad = document.getElementById('rv-pad');
  pad.innerHTML = '';
  const W = window.innerWidth, H = window.innerHeight, LS = W > H;
  const BAR_H = LS ? H : Math.round(Math.min(H*0.42,260));
  const BAR_Y = H - BAR_H;
  const COL_W = LS ? Math.round(Math.min(W*0.24,180)) : Math.round(W*0.50);
  const MAR=8, REF=LS?COL_W:BAR_H;
  const DS=Math.round(Math.min(REF*0.72,LS?COL_W-16:160));
  const BS=Math.round(Math.min(REF*0.28,LS?(COL_W-DS)*0.9:62));
  const GAP=Math.round(BS*0.10);
  const SW=Math.round(Math.min(COL_W*0.90,LS?COL_W-2*MAR:88));
  const SH=Math.round(Math.min(REF*0.14,34));
  const MW=Math.round(Math.min(LS?COL_W-2*MAR:W*0.14,72));
  const MH=Math.round(Math.min(REF*0.12,28));

  if(LS){[0,W-COL_W].forEach(x=>{const d=document.createElement('div');Object.assign(d.style,{position:'absolute',left:x+'px',top:'0',width:COL_W+'px',height:H+'px',background:skin.barBg,zIndex:'1',pointerEvents:'none'});pad.appendChild(d);});}
  else{const d=document.createElement('div');Object.assign(d.style,{position:'absolute',left:'0',top:BAR_Y+'px',width:W+'px',height:BAR_H+'px',background:skin.barBg,zIndex:'1',pointerEvents:'none'});pad.appendChild(d);}

  const diskCX=LS?Math.round(COL_W/2):Math.round(W*0.25);
  const diskCY=LS?Math.round(H*0.58):Math.round(BAR_Y+BAR_H*0.52);
  const faceCX=LS?Math.round(W-COL_W/2):Math.round(W*0.75);
  const faceCY=diskCY, shY=LS?MAR:BAR_Y+MAR;
  const metaCY=LS?Math.round(H/2-MH/2):Math.round(BAR_Y+BAR_H*0.12);
  const OFF=BS+GAP;
  const FPOS=[{dx:-OFF,dy:0},{dx:0,dy:-OFF},{dx:OFF,dy:0},{dx:0,dy:OFF}];

  function mkEl(c,s){const e=document.createElement('div');e.className=c;Object.assign(e.style,{position:'absolute',zIndex:'5'},s);return e;}
  function makeBtn(f,cx,cy,sz){sz=Math.max(sz,34);const e=mkEl('rv-btn',{width:sz+'px',height:sz+'px',left:(cx-sz/2)+'px',top:(cy-sz/2)+'px',fontSize:(f.fontSize||Math.round(sz*0.42))+'px',color:'#fff',background:f.color,border:`2.5px solid ${f.border}`,boxShadow:`0 0 18px ${f.glow||f.border+'99'}, 0 4px 14px rgba(0,0,0,.75)`,opacity:'.97'});e.textContent=f.label;bindBtn(e,f.input);return e;}
  function makeShoulder(sh,x,y){const lx=LS&&sh.side==='right'?W-MAR-SW:(LS?MAR:x);const e=mkEl('rv-shoulder',{width:SW+'px',height:SH+'px',left:(LS?lx:x)+'px',top:y+'px',fontSize:Math.round(SH*0.52)+'px',color:'#fff',background:sh.color,border:`1.5px solid ${sh.border}`,boxShadow:`0 0 12px ${sh.glow}`,opacity:'.95',borderRadius:sh.side==='right'?'10px 4px 4px 10px':'4px 10px 10px 4px'});e.textContent=sh.label;bindBtn(e,sh.input);return e;}
  function makeMeta(m,cx,cy,w,h){const e=mkEl('rv-meta',{width:w+'px',height:h+'px',left:(cx-w/2)+'px',top:(cy-h/2)+'px',fontSize:Math.round(h*0.5)+'px',color:m.textColor||'rgba(255,255,255,0.7)',background:m.color,border:`1px solid ${m.border}`,borderRadius:'20px',opacity:'.92'});e.textContent=m.label;bindBtn(e,m.input);return e;}
  function bindBtn(e,id){e.addEventListener('touchstart',ev=>{ev.preventDefault();e.classList.add('pressed');sendInput(id,1);},{passive:false});e.addEventListener('touchend',ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});e.addEventListener('touchcancel',ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});e.addEventListener('mousedown',()=>{e.classList.add('pressed');sendInput(id,1);});e.addEventListener('mouseup',()=>{e.classList.remove('pressed');sendInput(id,0);});}

  function makeDpad(color,border,cx,cy,size){
    const wrap=mkEl('',{width:size+'px',height:size+'px',left:(cx-size/2)+'px',top:(cy-size/2)+'px',touchAction:'none',pointerEvents:'auto',zIndex:'6',borderRadius:'50%',background:skin.diskBg,border:`2px solid ${skin.diskBorder||border+'44'}`,boxShadow:'0 4px 20px rgba(0,0,0,.5)'});wrap.id='rv-dpad';
    const inner=Math.round(size*0.75),offset=Math.round((size-inner)/2);
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 90 90');svg.setAttribute('width',inner);svg.setAttribute('height',inner);svg.style.cssText=`position:absolute;top:${offset}px;left:${offset}px;pointer-events:none;`;
    svg.innerHTML=`<g filter="drop-shadow(0 2px 8px rgba(0,0,0,.9))"><rect x="27" y="5" width="36" height="80" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/><rect x="5" y="27" width="80" height="36" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/><rect x="27" y="27" width="36" height="36" rx="5" fill="${color}"/><polygon points="45,11 54,26 36,26" fill="${border}" opacity=".95"/><polygon points="45,79 54,64 36,64" fill="${border}" opacity=".95"/><polygon points="11,45 26,54 26,36" fill="${border}" opacity=".95"/><polygon points="79,45 64,54 64,36" fill="${border}" opacity=".95"/></g>`;
    wrap.appendChild(svg);
    const DIRS=[{up:1,left:1},{up:1},{up:1,right:1},{left:1},{},{right:1},{down:1,left:1},{down:1},{down:1,right:1}];

    const R=size/2,KR=Math.round(R*0.42),MAX=R-KR-6;
    const inner=mkEl('',{position:'absolute',width:Math.round(size*0.75)+'px',height:Math.round(size*0.75)+'px',left:Math.round(size*0.125)+'px',top:Math.round(size*0.125)+'px',borderRadius:'50%',background:`radial-gradient(circle at 38% 35%, ${color}cc, ${color}77)`,border:`2px solid ${border}55`,pointerEvents:'none'});
    wrap.appendChild(inner);
    const knob=mkEl('',{position:'absolute',width:KR*2+'px',height:KR*2+'px',borderRadius:'50%',left:(R-KR)+'px',top:(R-KR)+'px',background:`radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), ${border}cc)`,border:`2.5px solid ${border}`,boxShadow:`0 0 18px ${border}bb, 0 4px 16px rgba(0,0,0,.8)`,transition:'none',pointerEvents:'none'});
    wrap.appendChild(knob);
    let active2=false,ox2=0,oy2=0;const THRESH=0.40,AV=0x7fff;
    const sent2={up:0,down:0,left:0,right:0};const DM2={up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
    function sD(d,v){if(sent2[d]===v)return;sent2[d]=v;sendInput(DM2[d],v);}
    function sA(nx,ny){sendInput(EJS_INPUT.LSTICK_RIGHT,nx>0?Math.round(nx*AV):0);sendInput(EJS_INPUT.LSTICK_LEFT,nx<0?Math.round(-nx*AV):0);sendInput(EJS_INPUT.LSTICK_DOWN,ny>0?Math.round(ny*AV):0);sendInput(EJS_INPUT.LSTICK_UP,ny<0?Math.round(-ny*AV):0);}

    wrap.addEventListener('touchmove',e=>{if(!active2)return;e.preventDefault();const t=e.touches[0];mv2(t.clientX-ox2,t.clientY-oy2);},{passive:false});

  if(s.analog) pad.appendChild(makeAnalog(s.dpad.color,s.dpad.border,diskCX,diskCY,DS));
  else pad.appendChild(makeDpad(s.dpad.color,s.dpad.border,diskCX,diskCY,DS));
  s.face.forEach((f,i)=>{const p=FPOS[i%4];pad.appendChild(makeBtn(f,Math.round(faceCX+p.dx),Math.round(faceCY+p.dy),BS));});
  s.shoulders.forEach(sh=>{pad.appendChild(makeShoulder(sh,sh.side==='right'?W-MAR-SW:MAR,shY+(sh.row||0)*(SH+4)));});

  pad.classList.add('active');
}

document.getElementById('rv-fs-btn').addEventListener('click',requestFS);

window.addEventListener('orientationchange',()=>{setTimeout(()=>{if(isTouch)initControls();},350);});
